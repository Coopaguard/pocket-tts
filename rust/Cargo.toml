[package]
name = "pocket-tts"
# Kept in step with the Python package in ../pyproject.toml.
version = "3.3.0"
edition = "2024"
description = "Kyutai's pocket-sized text-to-speech, as a standalone binary with the CLI of the Python package"
license = "MIT"
repository = "https://github.com/kyutai-labs/pocket-tts"
publish = false

[lib]
name = "pocket_tts"
path = "src/lib.rs"

[[bin]]
name = "pocket-tts"
path = "src/main.rs"
# The CLI is the whole reason axum, clap and tokio are here. Requiring the
# feature keeps `cargo build` building the binary as it always did, while
# `--no-default-features` gives a library that pulls none of the six.
required-features = ["cli"]

[features]
default = ["cli"]

# The command and the server. Nothing below this feature is used by the model,
# the config, the weights or the tokenizer — checked module by module.
cli = [
  "dep:axum",
  "dep:clap",
  "dep:tempfile",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tower-http",
]

# The SentencePiece tokenizer, which **needs CMake and a C++ compiler**. Most
# community models use it; none of the released ones do — they ship a Hugging
# Face `tokenizer.json`, which `tokenizers` reads in pure Rust. Off by default
# so the crate builds on a machine with no C++ toolchain, and a config that asks
# for SentencePiece then fails with a message naming this feature rather than
# with a link error.
sentencepiece = ["dep:sentencepiece"]

# Apple's Accelerate framework for the f32 matmuls, for macOS builds.
accelerate = ["ptts/accelerate"]

[dependencies]
# The model itself: https://github.com/gradium-ai/xn-ptts, through a fork that adds what pocket-tts
# models need on top of it (https://github.com/gabrieldemarmiesse/xn-ptts, branch
# pocket-tts-small-models), pinned to a commit since its API is still moving between release
# candidates.
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false, features = ["hf", "audio"] }
# Must be the version ptts uses, its tensors cross the boundary.
xn = "0.2.11"

anyhow = "1"
half = "2"
hf-hub = { version = "1.0", features = ["blocking"] }
log = "0.4"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
rand_distr = "0.5"
reqwest = { version = "0.13", features = ["blocking"] }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
symphonia = { version = "0.5.3", features = ["all"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

# Optional: the CLI and the server (`cli`), and the tokenizer that needs CMake
# (`sentencepiece`).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "query", "json", "form"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
sentencepiece = { version = "0.14", features = ["static"], optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
